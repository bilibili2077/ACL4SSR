[custom]
; acl4SSR 精简极简版

; ====== 拦截 UDP 443 (防止 QUIC 走代理) ======
ruleset=REJECT,[]AND,((PROTOCOL,UDP),(DST-PORT,443))

; ====== 基础直连规则 ======
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; ====== 修正：Cloudflare 核心服务走代理 ======
; 直接匹配 Cloudflare 及其统计服务、Workers 服务的后缀，防止其掉入漏网之鱼
ruleset=🚀 规则类型,[]DOMAIN-SUFFIX,cloudflare.com
ruleset=🚀 规则类型,[]DOMAIN-SUFFIX,cloudflareinsights.com
ruleset=🚀 规则类型,[]DOMAIN-SUFFIX,cloudflare.net
ruleset=🚀 规则类型,[]DOMAIN-SUFFIX,workers.dev

; ====== Google Play 核心规则 ======
ruleset=🚀 规则类型,[]DOMAIN-SUFFIX,services.googleapis.cn

; ====== AI 服务专属规则 ======
ruleset=🤖 Ai平台,https://raw.githubusercontent.com/bilibili2077/ACL4SSR/refs/heads/main/AiDomain

; ====== 其他直连规则 ======
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; ====== Google 推送（FCM） ======
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

; ====== 常用代理规则 ======
ruleset=🚀 规则类型,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 规则类型,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 规则类型,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; ====== GEOIP 匹配 ======
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ====== 策略组定义 ======
custom_proxy_group=🚀 规则类型`select`[]♻️ 自动选择`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☑️ 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.google.com/generate_204`600,,50
custom_proxy_group=🤖 Ai平台`select`[]🚀 规则类型`[]☑️ 手动切换`[]♻️ 自动选择`.*
custom_proxy_group=📢 谷歌FCM`select`[]🚀 规则类型`[]🎯 全球直连`[]♻️ 自动选择`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 规则类型
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 规则类型`[]🎯 全球直连`

enable_rule_generator=true
overwrite_original_rules=true
